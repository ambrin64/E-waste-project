[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bengaluru-ewaste-planner"
version = "0.1.0"
description = "Explainable GIS decision support for e-waste facility planning"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.2",
  "pydantic>=2.11.4",
  "geopandas>=1.0.1",
  "shapely>=2.0.7",
  "pyproj>=3.7.1",
  "pandas>=2.2.3",
  "networkx>=3.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "httpx>=0.28.1", "ruff>=0.11.8"]
reports = ["sqlalchemy>=2.0.40", "geoalchemy2>=0.17.1", "reportlab>=4.4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
